<svg xmlns="http://www.w3.org/2000/svg" width="460pt" height="280pt" viewBox="0 0 460 280">
<title>Formal main-experiment batch summary</title>
<rect width="460" height="280" fill="white"/>
<text x="24" y="24" font-family="Times New Roman, Times, serif" font-size="13" font-weight="bold" text-anchor="start" fill="black">Main experiment: batch summary</text>
<text x="24" y="41" font-family="Times New Roman, Times, serif" font-size="10" font-weight="normal" text-anchor="start" fill="black">Six Olden benchmarks; three independent ARM64 VM batches</text>
<line x1="24" x2="436" y1="55" y2="55" stroke="black" stroke-width="1.05"/>
<text x="30" y="72" font-family="Times New Roman, Times, serif" font-size="11" font-weight="bold" text-anchor="start" fill="black">VM batch</text>
<text x="430" y="72" font-family="Times New Roman, Times, serif" font-size="11" font-weight="bold" text-anchor="end" fill="black">Suite runtime ratio (×)</text>
<line x1="24" x2="436" y1="81" y2="81" stroke="black" stroke-width="0.55"/>
<text x="30" y="104" font-family="Times New Roman, Times, serif" font-size="12" font-weight="normal" text-anchor="start" fill="black">Batch 1</text>
<text x="430" y="104" font-family="Times New Roman, Times, serif" font-size="12" font-weight="normal" text-anchor="end" fill="black">2.2793</text>
<text x="30" y="128" font-family="Times New Roman, Times, serif" font-size="12" font-weight="normal" text-anchor="start" fill="black">Batch 2</text>
<text x="430" y="128" font-family="Times New Roman, Times, serif" font-size="12" font-weight="normal" text-anchor="end" fill="black">2.2791</text>
<text x="30" y="152" font-family="Times New Roman, Times, serif" font-size="12" font-weight="normal" text-anchor="start" fill="black">Batch 3</text>
<text x="430" y="152" font-family="Times New Roman, Times, serif" font-size="12" font-weight="normal" text-anchor="end" fill="black">2.2530</text>
<text x="30" y="183" font-family="Times New Roman, Times, serif" font-size="12" font-weight="bold" text-anchor="start" fill="black">Mean ± SD</text>
<text x="430" y="183" font-family="Times New Roman, Times, serif" font-size="12" font-weight="bold" text-anchor="end" fill="black">2.2705 ± 0.0151</text>
<line x1="24" x2="436" y1="198" y2="198" stroke="black" stroke-width="1.05"/>
<text x="24" y="215" font-family="Times New Roman, Times, serif" font-size="8.5" font-weight="normal" text-anchor="start" fill="black">Each batch value is the equal-weight mean of six program ratios (ASan mean / baseline mean).</text>
<text x="24" y="227" font-family="Times New Roman, Times, serif" font-size="8.5" font-weight="normal" text-anchor="start" fill="black">Five timings per arm and program; 60 timings per batch. Warmups are excluded.</text>
<text x="24" y="239" font-family="Times New Roman, Times, serif" font-size="8.5" font-weight="normal" text-anchor="start" fill="black">Final row: mean ± sample SD across three independent VM batches (n = 3).</text>
<text x="24" y="251" font-family="Times New Roman, Times, serif" font-size="8.5" font-weight="normal" text-anchor="start" fill="black">All six benchmarks retained; mst is short-running. Source: exp-001, protocol v0.2.</text>
</svg>
